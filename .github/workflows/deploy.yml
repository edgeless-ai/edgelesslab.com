name: CI/CD Pipeline

on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# GitHub Pages deploy requires pages: write permission
permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  # ── Job 1: Run full test suite ──────────────────────────────────
  test-suite:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "store_path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (vitest)
        run: pnpm vitest run

  # ── Job 2: Build static export ──────────────────────────────────
  build:
    name: Build Static Export
    runs-on: ubuntu-latest
    needs: test-suite
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "store_path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY || secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          NEXT_PUBLIC_INGEST_URL: ${{ vars.NEXT_PUBLIC_INGEST_URL || 'https://edgeless-ingest.djm-claude-assistant.workers.dev' }}

      - name: Verify static export output
        run: |
          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory missing — build failed"
            exit 1
          fi
          FILE_COUNT=$(find out -type f | wc -l)
          echo "Static export produced $FILE_COUNT files"
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

      - name: Upload build artifact (for GitHub Pages deploy)
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  # ── Job 3: Deploy to GitHub Pages ───────────────────────────────
  # Only deploys from main branch (GitHub Pages environment protection).
  # test/* branches are rejected by the environment — this is by design.
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [test-suite, build]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── Job 4: Database migrations (stub — static site, no DB) ──────
  migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [test-suite, build]
    timeout-minutes: 5
    if: false  # This is a static site — no database to migrate
    steps:
      - run: echo "No database migrations required (static site)"

  # ── Job 5: Smoke-test live endpoint ─────────────────────────────
  smoke-test:
    name: Smoke Test Endpoint
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    if: always()  # Run even if deploy failed
    steps:
      - name: Smoke test endpoint
        run: |
          URL="${BASE_URL:-https://edgelesslab.com}"
          echo "Smoke testing endpoint: $URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          if [ "$HTTP_CODE" = "000" ]; then
            echo "WARNING: Endpoint $URL is not reachable"
            echo "  (Expected if no deployment was made — deploy job was skipped or failed)"
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "SUCCESS: Endpoint responded with HTTP 200"
          else
            echo "WARNING: Endpoint responded with HTTP $HTTP_CODE (expected 200)"
          fi
        env:
          BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL || 'https://edgelesslab.com' }}