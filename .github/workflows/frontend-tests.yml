name: Frontend Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Support design system and TypeScript
        run: npm run check:design-system

      - name: Check static-export font preloads
        run: npm run test:font-preloads

      - name: Check launch readiness regressions
        run: npm run test:launch

      - name: Run vitest
        run: npx vitest run
