name: Frontend Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded commits on the same PR/ref cannot produce redundant failure runs.
# Other PRs/refs remain independent; no path-based test skips.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Support design system and TypeScript
        run: npm run check:design-system

      - name: Check static-export font preloads
        run: npm run test:font-preloads

      - name: Check launch readiness regressions
        run: npm run test:launch

      - name: Run vitest
        run: npx vitest run
