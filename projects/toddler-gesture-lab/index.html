<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#090b18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Color Garden">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Color Garden</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed;
      inset: 0;
      background: #090b18;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #parent-panel {
      position: fixed;
      z-index: 20;
      top: calc(var(--safe-top) + 18px);
      left: 50%;
      width: min(440px, calc(100vw - 36px));
      transform: translate(-50%, -14px);
      padding: 18px;
      color: #f5f5f1;
      background: rgba(12, 14, 25, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      font: 15px/1.4 system-ui, -apple-system, sans-serif;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(20px);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
    }
    #parent-panel.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    #parent-panel h1 { margin: 0 0 5px; font-size: 20px; }
    #parent-panel p { margin: 0 0 15px; color: rgba(255, 255, 255, 0.68); font-size: 13px; }
    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .panel-grid button, .panel-grid select {
      min-height: 48px;
      padding: 10px 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 11px;
      font: 600 14px/1.2 system-ui, sans-serif;
    }
    .panel-grid button:active { transform: scale(0.98); }
    .panel-grid .wide { grid-column: 1 / -1; }
    #close-panel { background: #d8ff57; color: #10130b; }
    #gate-progress {
      position: fixed;
      z-index: 8;
      top: 50%;
      left: 50%;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%) scale(0.8);
      border: 5px solid rgba(255, 255, 255, 0.13);
      border-top-color: #d8ff57;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    #gate-progress.active { opacity: 0.7; animation: gate 2.2s linear forwards; }
    @keyframes gate {
      from { transform: translate(-50%, -50%) scale(0.8) rotate(0deg); }
      to { transform: translate(-50%, -50%) scale(1) rotate(720deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #parent-panel { transition: none; }
      #gate-progress.active { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="garden" aria-label="Touch-responsive color garden"></canvas>

  <div id="gate-progress" aria-hidden="true"></div>

  <section id="parent-panel" aria-label="Parent controls" aria-hidden="true">
    <h1>Color Garden</h1>
    <p>Parent controls. Hold both top corners for two seconds to open this panel.</p>
    <div class="panel-grid">
      <select id="scene" aria-label="Visual scene">
        <option value="flow">Flow garden</option>
        <option value="bloom">Bloom pond</option>
        <option value="ribbon">Ribbon sky</option>
        <option value="stars">Soft stars</option>
      </select>
      <select id="palette" aria-label="Color palette">
        <option value="electric">Electric fruit</option>
        <option value="ocean">Deep ocean</option>
        <option value="sherbet">Soft sherbet</option>
        <option value="forest">Night garden</option>
        <option value="sunrise">Warm sunrise</option>
      </select>
      <button id="sound" type="button" aria-pressed="false">Sound: off</button>
      <button id="calm" type="button" aria-pressed="false">Calm mode: off</button>
      <button id="clear" type="button">Clear canvas</button>
      <button id="fullscreen" type="button">Full screen</button>
      <button class="wide" id="close-panel" type="button">Back to play</button>
    </div>
  </section>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator && window.isSecureContext) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
