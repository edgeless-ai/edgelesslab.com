<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" role="img" aria-labelledby="title desc"><title id="title">Light, dark and superdark autonomy compared</title><desc id="desc">Original Edgeless explanatory illustration. Based on The Superdark Factory · Antikythera · Chapter II. A conceptual diagram, not observed performance.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24384d" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#dfbd7f" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#0e1a27"/><rect width="100%" height="100%" fill="url(#grid)"/><style>text{font-family:system-ui,sans-serif;fill:#e8edf1} .muted{fill:#afc2d1}.accent{fill:#dfbd7f}.mono{font-family:ui-monospace,monospace} .edge{fill:none;stroke:#dfbd7f;stroke-width:2;marker-end:url(#arrow)}</style><text x="40" y="62" font-size="36" class="">WHO GETS TO SET THE GOAL?</text><text x="40" y="105" font-size="24" class="muted">Light → dark → superdark: an explanatory ladder</text><rect x="40" y="148" width="880" height="180" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="64" y="186" font-size="24" class="accent mono">LIGHT</text><text x="64" y="230" font-size="30" class="">People prescribe the work.</text><text x="64" y="270" font-size="24" class="muted">A tool follows a specified procedure.</text><text x="64" y="306" font-size="24" class="muted">People inspect and revise the plan.</text><path class="edge" d="M480 334V355"/><rect x="40" y="364" width="880" height="180" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="64" y="402" font-size="24" class="accent mono">DARK</text><text x="64" y="446" font-size="30" class="">The system optimizes an assigned goal.</text><text x="64" y="486" font-size="24" class="muted">More work proceeds unattended.</text><text x="64" y="522" font-size="24" class="muted">The objective still comes from outside.</text><path class="edge" d="M480 550V571"/><rect x="40" y="580" width="880" height="180" rx="4" fill="#122235" stroke="#dfbd7f" stroke-width="2"/><text x="64" y="618" font-size="24" class="accent mono">SUPERDARK</text><text x="64" y="662" font-size="30" class="">The system helps form its own goals.</text><text x="64" y="702" font-size="24" class="muted">Objectives emerge through interaction.</text><text x="64" y="738" font-size="24" class="muted">This is the paper’s speculative horizon.</text><text x="40" y="828" font-size="23" class="muted">Not a maturity score or a literal mapping to the paper’s classes.</text><text x="40" y="874" font-size="18" class="muted mono">EDGELESS LAB / Interpretation · superdark.antikythera.org / Chapter I</text></svg>