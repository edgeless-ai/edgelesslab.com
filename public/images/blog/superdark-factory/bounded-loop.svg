<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 916" role="img" aria-labelledby="title desc"><title id="title">Edgeless bounded lane and independent review loop</title><desc id="desc">Original Edgeless explanatory illustration. Based on The Superdark Factory · Antikythera · Chapter II. A conceptual diagram, not observed performance.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24384d" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#dfbd7f" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#0e1a27"/><rect width="100%" height="100%" fill="url(#grid)"/><style>text{font-family:system-ui,sans-serif;fill:#e8edf1} .muted{fill:#afc2d1}.accent{fill:#dfbd7f}.mono{font-family:ui-monospace,monospace} .edge{fill:none;stroke:#dfbd7f;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="52" font-size="29" class="">AUTONOMY INSIDE A LANE</text><text x="32" y="90" font-size="19" class="muted">Edgeless’s design adaptation, not a rollout report.</text><rect x="32" y="132" width="576" height="94" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="50" y="165" font-size="22" class="accent mono">CONTRACT</text><text x="50" y="198" font-size="20" class="">Inputs, output, permitted effects, stop rule</text><path class="edge" d="M320 230V249"/><rect x="32" y="256" width="576" height="94" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="50" y="289" font-size="22" class="accent mono">ELIGIBLE WORKER</text><text x="50" y="322" font-size="20" class="">Capability does not grant blanket authority</text><path class="edge" d="M320 354V373"/><rect x="32" y="380" width="576" height="94" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="50" y="413" font-size="22" class="accent mono">EXACT ARTIFACT</text><text x="50" y="446" font-size="20" class="">A retained result, not just a pass message</text><path class="edge" d="M320 478V497"/><rect x="32" y="504" width="576" height="94" rx="4" fill="#122235" stroke="#dfbd7f" stroke-width="2"/><text x="50" y="537" font-size="22" class="accent mono">INDEPENDENT REVIEW</text><text x="50" y="570" font-size="20" class="">Rerun checks; bind approval to this revision</text><path class="edge" d="M320 602V621"/><rect x="32" y="628" width="576" height="94" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="50" y="661" font-size="22" class="accent mono">OUTCOME RECORD</text><text x="50" y="694" font-size="20" class="">Trace a later verdict to the actual decision</text><text x="32" y="790" font-size="21" class="accent">Missing evidence → pause. Review backlog → slow down.</text><text x="32" y="826" font-size="21" class="accent">More autonomy never bypasses authorization.</text><text x="32" y="888" font-size="17" class="muted mono">EDGELESS LAB / Adoption decision record / 2026-11-07</text></svg>