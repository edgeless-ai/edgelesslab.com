<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 930" role="img" aria-labelledby="title desc"><title id="title">Four principles and the constitutional kernel</title><desc id="desc">Original Edgeless explanatory illustration. Based on The Superdark Factory · Antikythera · Chapter II. A conceptual diagram, not observed performance.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24384d" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#dfbd7f" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#0e1a27"/><rect width="100%" height="100%" fill="url(#grid)"/><style>text{font-family:system-ui,sans-serif;fill:#e8edf1} .muted{fill:#afc2d1}.accent{fill:#dfbd7f}.mono{font-family:ui-monospace,monospace} .edge{fill:none;stroke:#dfbd7f;stroke-width:2;marker-end:url(#arrow)}</style><text x="40" y="60" font-size="38" class="">THE DARK STACK</text><text x="40" y="104" font-size="25" class="muted">Four principles. One foundational constraint.</text><rect x="40" y="150" width="420" height="208" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="62" y="188" font-size="23" class="accent mono">01 / PRIMITIVES</text><text x="62" y="234" font-size="24" class="">Compose learning-capable parts.</text><text x="62" y="282" font-size="22" class="muted">Define inputs, outputs, memory,</text><text x="62" y="318" font-size="22" class="muted">actions and attributable feedback.</text><rect x="500" y="150" width="420" height="208" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="522" y="188" font-size="23" class="accent mono">02 / VERSIONING</text><text x="522" y="234" font-size="24" class="">Identify persistent behavior.</text><text x="522" y="282" font-size="22" class="muted">Keep code provenance; watch</text><text x="522" y="318" font-size="22" class="muted">what the system actually does.</text><rect x="40" y="386" width="420" height="208" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="62" y="424" font-size="23" class="accent mono">03 / EVALUATIONS</text><text x="62" y="470" font-size="24" class="">Observe consequences.</text><text x="62" y="518" font-size="22" class="muted">Challenge results and judges;</text><text x="62" y="554" font-size="22" class="muted">look beyond one fixed test.</text><rect x="500" y="386" width="420" height="208" rx="4" fill="#122235" stroke="#5d7890" stroke-width="2"/><text x="522" y="424" font-size="23" class="accent mono">04 / CHARTER</text><text x="522" y="470" font-size="24" class="">Negotiate governing terms.</text><text x="522" y="518" font-size="22" class="muted">Revisable rules coordinate</text><text x="522" y="554" font-size="22" class="muted">the factory across timescales.</text><rect x="20" y="130" width="920" height="704" rx="7" fill="none" stroke="#dfbd7f" stroke-width="2"/><text x="40" y="630" font-size="22" class="accent">Shared foundation: the kernel constrains all four principles.</text><rect x="40" y="652" width="880" height="164" rx="4" fill="#122235" stroke="#dfbd7f" stroke-width="2"/><text x="64" y="690" font-size="25" class="accent mono">CONSTITUTIONAL KERNEL</text><text x="64" y="734" font-size="23" class="muted">Hard casts: commitments costly to break.</text><text x="64" y="770" font-size="23" class="muted">Soft casts: revisable commitments. Kernel: foundational rules.</text><text x="40" y="858" font-size="23" class="accent">Paper: immutable kernel. Edgeless: retains operator intervention.</text><text x="40" y="904" font-size="18" class="muted mono">EDGELESS LAB / Interpretation · superdark.antikythera.org / Chapter II</text></svg>