    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b38" x="55.44" y="411.706613" transform="rotate(-0 55.44 411.706613)">Retrieval locates artifacts. Connection and validation turn candidates into findings.</text>
