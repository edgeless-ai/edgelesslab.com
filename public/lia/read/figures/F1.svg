  <g id="text_5">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b38" x="55.44" y="46.276406" transform="rotate(-0 55.44 46.276406)">The epistemic backlog</text>
  </g>
  <g id="text_6">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586873" x="55.44" y="78.238125" transform="rotate(-0 55.44 78.238125)">Recorded information is not the same thing as articulated understanding.</text>
  </g>
  <g id="text_7">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #182b38" transform="translate(55.44 506.598281)">Conceptual diagram, not a measured ratio. The sizes do not estimate how much remains unrecognized. The economic thesis is a</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #182b38" transform="translate(55.44 520.587531)">research proposition, not an established universal law.</text>
  </g>
  <g id="text_8">
