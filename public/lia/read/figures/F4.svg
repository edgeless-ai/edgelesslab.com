  </g>
  <g id="text_7">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #182b38" transform="translate(55.44 506.598281)">Conceptual model, not a measured inventory. The diagram does not assume that all explicit claims are recoverable. Membership</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #182b38" transform="translate(55.44 520.587531)">depends on corpus, time, methods, and reference record; candidate status is not validation.</text>
  </g>
