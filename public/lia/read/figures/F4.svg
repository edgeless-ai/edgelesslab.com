  <g id="text_5">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b38" x="55.44" y="46.276406" transform="rotate(-0 55.44 46.276406)">The discovery boundary</text>
