  <g id="text_6">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b38" x="55.44" y="46.276406" transform="rotate(-0 55.44 46.276406)">Swanson: connecting two literatures</text>
  </g>
  <g id="text_7">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586873" x="55.44" y="78.238125" transform="rotate(-0 55.44 78.238125)">A → B → C is a route to a clinical hypothesis, not a proof of treatment efficacy.</text>
  </g>
  <g id="text_8">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #182b38" transform="translate(55.44 506.598281)">The antecedent literatures are not dated here. RA05–RA06 support the reconstruction; RA02 is only a bibliographic record. The</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #182b38" transform="translate(55.44 520.587531)">trial reported benefit for primary, not secondary, Raynaud’s.</text>
  </g>
  <g id="text_9">
