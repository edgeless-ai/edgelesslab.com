<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://shop.edgelesslab.com/">
  <title>The shop has moved — Edgeless Lab</title>
  <noscript><meta http-equiv="refresh" content="0; url=https://shop.edgelesslab.com/"></noscript>
  <script>
    (async function () {
      const home = 'https://shop.edgelesslab.com/';
      const sku = new URLSearchParams(window.location.search).get('sku');
      // Legacy gallery IDs are not products. Only an exact available catalog
      // match may deep-link; unknown, retired and malformed SKUs go home.
      if (!sku || !/^[a-z0-9][a-z0-9-]{0,199}$/.test(sku)) {
        window.location.replace(home);
        return;
      }
      let target = home;
      try {
        const response = await fetch(home + 'catalog.json', {
          credentials: 'omit', signal: AbortSignal.timeout(3000),
        });
        if (response.ok) {
          const catalog = await response.json();
          const listing = Array.isArray(catalog.designs)
            ? catalog.designs.find(item => item.slug === sku && item.available === true && !item.sold_out)
            : null;
          // Never use a catalog-provided URL or a caller-controlled origin.
          if (listing) target = home + 'd/' + encodeURIComponent(sku) + '/';
        }
      } catch {
        // Network/CORS/timeouts must not strand existing gallery bookmarks.
      }
      window.location.replace(target);
    }());
  </script>
</head>
<body>
  <main>
    <h1>One shop. All Edgeless merch.</h1>
    <p>This old print catalog has retired. Continue to the real shop for current products, prices and checkout.</p>
    <p><a href="https://shop.edgelesslab.com/">Open the Edgeless shop →</a></p>
  </main>
</body>
</html>
